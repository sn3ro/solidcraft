# Throwaway: do #15405's outcome tests already differ on macOS on main?
name: libm proof (outcome tests on macOS main)
on:
  push:
    branches: [proof/one-libm-goldens]
permissions:
  contents: read
jobs:
  tests:
    runs-on: blacksmith-12vcpu-macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: solidcore
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1df54142f77723b40c5a7ab1100ae1c0576950fc
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Tests on main
        run: |
          uname -a
          cargo test --no-fail-fast --profile goldens -p solidcore \
            --test wr_407_swept_arc_walls_join_without_fold --test issue_2975_stitch_gap_report \
            --test fillet_round_failure_notes_status --test wr512_singular_start_inside_direction \
            --test issue_2365_nxn_setback_corners --test issue_2223_section_end_trim_at_creases \
            --test issue_2314_tab_corner_arcs -- --test-threads 8 2>&1 | grep -E "^test |panicked|test result" -A1 || true
          cargo test --profile goldens -p solidcore-convert --test issue_3185_label_margins 2>&1 | grep -E "^test |panicked|margin 0.0|test result" -A1 || true
